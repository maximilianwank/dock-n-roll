name: Renovate
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.12
        with:
          configurationFile: renovate.json
          token: ${{ secrets.GITHUB_TOKEN }}
