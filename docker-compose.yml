services:
  vaultwarden:
    container_name: vaultwarden
    image: vaultwarden/server:1.37.5@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
    restart: always
    volumes:
      - "${DOCKER_VOLUMES}/vaultwarden:/data"
    environment:
      DOMAIN: "${DOMAIN}:315"
      ORG_CREATION_USERS: "${EMAIL}"
      SIGNUPS_ALLOWED: "false"
      EXPERIMENTAL_CLIENT_FEATURE_FLAGS: "ssh-key-vault-item"
    dns:
      - 127.0.0.1
  caddy:
    container_name: caddy
    image: caddy:2@sha256:ce773ec7a742ce15ee6bf2bb5f65882b9e2a4487b10733e6f1484f86e6b5d8bc
    restart: always
    ports:
      - "80:80"  # Needed for the ACME HTTP-01 challenge.
      - "443:443"
      - "443:443/udp"  # Needed for HTTP/3.
      - "314:314"  # Pihole
      - "315:315"  # Vaultwarden
      - "316:316"  # Odoo
      - "317:317"  # MeTube
      - "318:318"  # Radicale
      - "319:319"  # Beszel
      - "320:320"  # Speedtest
    volumes:
      - "${DOCKER_VOLUMES}/caddy/Caddyfile:/etc/caddy/Caddyfile"
      - "${DOCKER_VOLUMES}/caddy/config:/config"
      - "${DOCKER_VOLUMES}/caddy/data:/data"
    environment:
      DOMAIN: "${DOMAIN}"
      EMAIL: "${EMAIL}"
      LOG_FILE: "/data/access.log"
      RADICALE_USER: "${RADICALE_USER}"
      RADICALE_PASSWORD_HASH: "${RADICALE_PASSWORD_HASH}"
    dns:
      - 8.8.8.8
  pihole:
    container_name: pihole
    image: pihole/pihole:2026.10.1@sha256:30f803ad5dd60ff96cc0a63008a2e9271af481c1b0399a182192b2e91152c1f9
    restart: always
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - "${DOCKER_VOLUMES}/pihole/pihole:/etc/pihole"
      - "${DOCKER_VOLUMES}/pihole/dnsmasq.d:/etc/dnsmasq.d"
    hostname: pi4
    environment:
      TZ: "Europe/Berlin"
      FTLCONF_dns_listeningMode: "all"
    dns:
      - 8.8.8.8
  odoo:
    container_name: odoo
    image: odoo:18@sha256:f61d3e36eb699e63557bbcdf4d7bd659e51418c326009e6574565d87e1d9026d
    depends_on:
      - postgres
    environment:
      HOST: postgres
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - "${DOCKER_VOLUMES}/odoo/data:/var/lib/odoo"
      - "${DOCKER_VOLUMES}/odoo/config:/etc/odoo"
    restart: always
    dns:
      - 8.8.8.8
  postgres:
    container_name: postgres
    image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - "${DOCKER_VOLUMES}/postgres/db:/var/lib/postgresql/data"
    restart: always
  metube:
    container_name: metube
    image: ghcr.io/alexta69/metube:2026.11.10@sha256:6654866e76eab4228530dc5ed828ccfd702d1ee810feab2d629028272b399e14
    restart: unless-stopped
    volumes:
      - "${DOCKER_VOLUMES}/metube/downloads:/downloads"
    dns:
      - 8.8.8.8
  radicale:
    container_name: radicale
    image: tomsquest/docker-radicale:3.9.0.0@sha256:2f215d0e6a78ff68c280975af6ce580b05976f70c62b51640397e3eb5a7aa0e9
    restart: unless-stopped
    environment:
      TAKE_FILE_OWNERSHIP: "false"
    volumes:
      - "${DOCKER_VOLUMES}/radicale/data:/data"
    dns:
      - 8.8.8.8
  beszel:
    container_name: beszel
    image: henrygd/beszel:0@sha256:8514a69d9bbbcb74f371a3205561ee231fc0289739cea64e8131f341d695b770
    restart: unless-stopped
    volumes:
      - "${DOCKER_VOLUMES}/beszel/data:/beszel_data"
      - "${DOCKER_VOLUMES}/beszel/agent_data/agent.sock:/var/run/beszel/beszel-agent.sock:ro"
    dns:
      - 8.8.8.8
  beszel-agent:
    image: henrygd/beszel-agent:0@sha256:343254226ae57a5cc6f8c23c755b1464730aba2abc7043116a2e222711ec6e1a
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - "${DOCKER_VOLUMES}/beszel/agent_data:/var/lib/beszel-agent"
    environment:
      LISTEN: 45876
      KEY: "${BESZEL_KEY}"
      TOKEN: "${BESZEL_TOKEN}"
      HUB_URL: "${BESZEL_HUB_URL}"
  speedtest:
    container_name: speedtest
    image: ghcr.io/librespeed/speedtest:6@sha256:bc34bf69b6c102b23ab81b6e77beb7cce321fb0d3be33ec6e80edef3e9dd8bab
    restart: always
    environment:
      MODE: standalone
